<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup-Buch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Counter-Strike 2 &middot; Utility</p>
    <h1>Lineup-Buch</h1>
    <p id="lead">Map wählen, dann Lineups ansehen. Position anstellen, Fadenkreuz setzen, werfen.</p>
  </header>

  <!-- 1) Startseite: Map-Auswahl -->
  <section id="mapView">
    <div class="maps" id="maps"></div>
  </section>

  <!-- 2) Zwischenschritt: kompakte Lineup-Liste einer Map -->
  <section id="listView" hidden>
    <nav class="bar" aria-label="Navigation">
      <button class="back" id="backToMaps">&larr; Maps</button>
      <h2 class="bar-title" id="listTitle"></h2>
      <div class="seg" id="modeSeg" role="group" aria-label="Ansicht">
        <button class="chip" data-mode="list">Liste</button>
        <button class="chip" data-mode="radar">Radar</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Suchen: Ziel, Position…" aria-label="Lineups durchsuchen">
      <a class="back" id="addLink" href="editor.html">+ Lineup</a>
    </nav>
    <div class="filters" id="filters"></div>
    <div class="lu-list" id="luList"></div>
    <div id="radarView" hidden>
      <div class="radar" id="radar"></div>
      <div class="legend"><span><i style="background:#D0D7DE"></i>Smoke</span><span><i style="background:#F5D547"></i>Flash</span><span><i style="background:#F0883E"></i>Molotov</span><span><i style="background:#F85149"></i>HE</span><span><i style="background:var(--hud)"></i>gemischt</span></div>
      <p class="radar-note" id="radarNote"></p>
    </div>
    <footer id="count"></footer>
  </section>

  <!-- 3) Detailseite: einzelnes Lineup -->
  <section id="detailView" hidden>
    <nav class="bar" aria-label="Navigation">
      <button class="back" id="backToList">&larr; <span id="detailBackLabel"></span></button>
      <h2 class="bar-title" id="detailTitle"></h2>
      <a class="back bar-end" id="editLink" href="editor.html">Bearbeiten</a>
    </nav>
    <main id="detail"></main>
  </section>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Bild groß"><img id="lb-img" alt=""><p class="lb-cap">Klicken oder Esc zum Schließen</p></div>

<script src="data/maps.js"></script>
<script src="js/common.js"></script>
<script>
const mapView     = document.getElementById('mapView');
const listView    = document.getElementById('listView');
const detailView  = document.getElementById('detailView');
const mapsEl      = document.getElementById('maps');
const luList      = document.getElementById('luList');
const detail      = document.getElementById('detail');
const q           = document.getElementById('q');
const lb          = document.getElementById('lb');
const lbImg       = document.getElementById('lb-img');
const listTitle   = document.getElementById('listTitle');
const detailTitle = document.getElementById('detailTitle');
const detailBackLabel = document.getElementById('detailBackLabel');
const lead        = document.getElementById('lead');
const addLink     = document.getElementById('addLink');
const editLink    = document.getElementById('editLink');
const modeSeg     = document.getElementById('modeSeg');
const filtersEl   = document.getElementById('filters');
const radarView   = document.getElementById('radarView');
const radarEl     = document.getElementById('radar');
const radarNote   = document.getElementById('radarNote');

// Editor-Links nur lokal (localhost oder Doppelklick auf die Datei); die öffentliche Seite hat keinen Editor.
const isLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
addLink.hidden = editLink.hidden = !isLocal;

let activeMap = null;   // aktuell gewählte Map (Liste)
let activeId  = null;   // aktuell gewähltes Lineup (Detail)
let listMode  = 'radar'; // 'radar' (Standard, sofern die Map ein Radar hat) | 'list' – bleibt beim Zurückkehren erhalten
let sideFilter = '', typeFilter = '';
let radarClusters = [], openCluster = -1;

const countFor = name => LINEUPS.filter(l => l.map === name).length;

// Listen-Vorschau: <lineup>/thumb.webp, fällt bei Fehlen auf das volle Result-Bild zurück.
const thumbOf = src => src.replace(/[^/]+$/, 'thumb.webp');
const onThumbErr = `if(this.dataset.full){this.src=this.dataset.full;delete this.dataset.full}else{${onErr}}`;

/* ---------- 1) Startseite: Map-Galerie ---------- */
function renderMaps() {
  // Alle in MAPS definierten Maps + evtl. Maps, die nur in LINEUPS vorkommen.
  const known = new Set(MAPS.map(m => m.name));
  const extra = [...new Set(LINEUPS.map(l => l.map))].filter(m => !known.has(m)).map(name => ({ name }));
  const all = [...MAPS, ...extra];

  mapsEl.innerHTML = all.map(m => {
    const n = countFor(m.name);
    const thumb = m.img
      ? `<div class="map-thumb" data-map="${esc(m.name)}"><img src="${esc(m.img)}" alt="${esc(m.name)}" loading="lazy" onerror="${onErr}"></div>`
      : `<div class="map-thumb missing" data-map="${esc(m.name)}"></div>`;
    return `
      <button class="map-card" data-map="${esc(m.name)}">
        ${thumb}
        <div class="map-meta">
          <h2>${esc(m.name)}</h2>
          <span class="map-count ${n ? '' : 'zero'}">${n ? n + (n === 1 ? ' Lineup' : ' Lineups') : 'leer'}</span>
        </div>
      </button>`;
  }).join('');
}

/* ---------- 2) Zwischenschritt: kompakte Liste einer Map ---------- */
// Suche + Seiten-/Typ-Filter gelten für Liste und Radar gleichermaßen.
function filtered() {
  const term = q.value.trim().toLowerCase();
  return LINEUPS.filter(l =>
    l.map === activeMap &&
    (!sideFilter || l.side === sideFilter) &&
    (!typeFilter || typesOf(l).includes(typeFilter)) &&
    (!term || (l.title + ' ' + l.from + ' ' + typeLabel(l)).toLowerCase().includes(term))
  );
}

function renderFilters() {
  const types = [...new Set(LINEUPS.filter(l => l.map === activeMap).flatMap(typesOf))];
  const chips = (kind, cur, vals) => vals.map(([v, t]) =>
    `<button class="chip" data-f="${kind}" data-v="${esc(v)}" aria-pressed="${cur === v}">${esc(t)}</button>`).join('');
  filtersEl.innerHTML =
    `<div class="seg">${chips('side', sideFilter, [['', 'Alle Seiten'], ['T', 'T'], ['CT', 'CT']])}</div>` +
    `<div class="seg">${chips('type', typeFilter, [['', 'Alle Typen'], ...types.map(t => [t, t])])}</div>`;
}

function renderView() {
  const radar = listMode === 'radar';
  luList.hidden = radar; radarView.hidden = !radar;
  modeSeg.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === listMode));
  const rows = filtered();
  if (radar) renderRadar(rows); else renderList(rows);
  document.getElementById('count').textContent =
    rows.length + (rows.length === 1 ? ' Lineup' : ' Lineups') + ' · ' + countFor(activeMap) + ' auf ' + activeMap;
}

function renderList(rows) {

  luList.innerHTML = rows.length ? rows.map(l => {
    const n = (l.lineups || []).length;
    const res = asResults(l);
    const preview = (res[0] && res[0].img)
      ? `<div class="lu-thumb"><img src="${esc(thumbOf(res[0].img))}" data-full="${esc(res[0].img)}" alt="Result: ${esc(l.title)}" loading="lazy" onerror="${onThumbErr}"></div>`
      : `<div class="lu-thumb missing"></div>`;
    return `
      <button class="lu-item" data-id="${esc(l.id)}">
        ${preview}
        <div class="lu-info">
          <h3>${esc(l.title)}</h3>
          <div class="lu-tags">
            <span class="tag side-${esc(l.side)}">${esc(l.side)}-Seite</span>
            <span class="tag">${esc(typeLabel(l))}</span>
            <span class="tag">${esc(l.from)}</span>
          </div>
          <p class="lu-sub">${res[0] && res[0].note ? ' · ' + esc(res[0].note) : ''}</p>
        </div>
        <span class="lu-arrow" aria-hidden="true">&rarr;</span>
      </button>`;
  }).join('') : `<p class="empty">Kein Lineup gefunden. Andere Suche versuchen.</p>`;
}

/* ---------- 2b) Radar: wo die Utility landet ---------- */
// Würfe mit (fast) gleichem Landepunkt teilen sich einen Marker; ein Lineup mit mehreren Würfen hat mehrere Marker.
function clusterize(rows) {
  const out = [];
  for (const p of rows.flatMap(radarPoints)) {
    const c = out.find(c => Math.hypot(c.x - p.landAt.x, c.y - p.landAt.y) < 0.025);
    if (c) c.items.push(p); else out.push({ x: p.landAt.x, y: p.landAt.y, items: [p] });
  }
  return out;
}
const pointName = p => p.l.title + (p.step >= 0 ? ' – ' + p.label : '');

function pinHtml(c, i) {
  const types = new Set(c.items.flatMap(p => p.types)), sides = new Set(c.items.map(p => p.l.side));
  const bg = types.size === 1 ? typeColor([...types][0]) : 'var(--hud)';
  const side = sides.size === 1 ? 'side-' + c.items[0].l.side : 'side-mix';
  const label = c.items.length > 1 ? c.items.length : typeLetters(c.items[0].types);
  const tip = c.items.map(p => `${pointName(p)} (${p.types.join(' + ')} von ${p.l.from})`).join(' · ');
  return `<button class="pin ${side}${i === openCluster ? ' open' : ''}" style="left:${pct(c.x)};top:${pct(c.y)};background:${bg}"
    data-c="${i}" title="${esc(tip)}" aria-label="${esc(tip)}">${label}</button>`;
}

function popHtml(c) {
  const side = c.x > 0.7 ? ' left' : c.x < 0.3 ? ' right' : '';
  const up = c.y > 0.6 ? ' up' : '';
  return `<div class="pop${side}${up}" style="left:${pct(c.x)};top:${pct(c.y)}" role="menu">
    ${c.items.map(p => {
      const l = p.l, r = asResults(l)[0];
      return `<button class="pop-item" data-id="${esc(l.id)}" data-step="${p.step}" role="menuitem">
        ${r && r.img ? `<img src="${esc(thumbOf(r.img))}" data-full="${esc(r.img)}" alt="" onerror="${onThumbErr}">` : ''}
        <span><b>${esc(pointName(p))}</b><small>${esc(l.side)} · ${esc(p.types.join(' + '))} · von ${esc(l.from)}</small></span>
      </button>`;
    }).join('')}
  </div>`;
}

function renderRadar(rows) {
  radarClusters = clusterize(rows);
  if (openCluster >= radarClusters.length) openCluster = -1;
  radarEl.innerHTML = `
    <img src="${esc(radarOf(activeMap))}" alt="Radar ${esc(activeMap)}">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    ${radarClusters.map(pinHtml).join('')}
    ${openCluster >= 0 ? popHtml(radarClusters[openCluster]) : ''}`;
  showLines(openCluster);
  const missing = rows.filter(l => !radarPoints(l).length).length;
  radarNote.innerHTML = missing
    ? `${missing} ${missing === 1 ? 'Lineup hat' : 'Lineups haben'} noch keinen Radar-Punkt` +
      (isLocal ? ` · <a href="editor.html#fill=${encodeURIComponent(activeMap)}">jetzt nachtragen</a>` : '')
    : '';
}

function showLines(i) {
  const svg = radarEl.querySelector('svg');
  if (svg) svg.innerHTML = i >= 0 && radarClusters[i] ? throwLines(radarClusters[i].items) : '';
}

/* ---------- 3) Detailansicht: ein Lineup ---------- */
function renderDetail() {
  const l = LINEUPS.find(x => x.id === activeId);
  if (!l) { showList(activeMap); return; }
  detailTitle.textContent = l.title;
  detail.innerHTML = lineupCard(l);
}

/* ---------- Navigation zwischen den Ansichten ---------- */
const setHash = h => history.replaceState(null, '', h ? ('#' + h) : location.pathname);

function showMaps() {
  activeMap = null; activeId = null;
  listView.hidden = true; detailView.hidden = true; mapView.hidden = false;
  lead.textContent = 'Map wählen, dann Lineup aussuchen. Position anstellen, Fadenkreuz setzen, werfen.';
  setHash('');
  window.scrollTo(0, 0);
}
function showList(name, mode = listMode) {
  if (name !== activeMap) { sideFilter = ''; typeFilter = ''; }
  activeMap = name; activeId = null; openCluster = -1;
  listMode = mode === 'radar' && radarOf(name) ? 'radar' : 'list';
  modeSeg.hidden = !radarOf(name);
  mapView.hidden = true; detailView.hidden = true; listView.hidden = false;
  listTitle.textContent = name;
  lead.textContent = 'Lineup wählen, um Position, Würfe und Result im Detail zu sehen.';
  addLink.href = 'editor.html#map=' + encodeURIComponent(name);
  q.value = '';
  renderFilters();
  renderView();
  setHash(encodeURIComponent(name) + (listMode === 'list' && radarOf(name) ? '/list' : ''));
  window.scrollTo(0, 0);
}
function showDetail(id, step = -1) {
  const l = LINEUPS.find(x => x.id === id);
  if (!l) { showMaps(); return; }
  activeMap = l.map; activeId = id;
  mapView.hidden = true; listView.hidden = true; detailView.hidden = false;
  detailBackLabel.textContent = l.map;
  lead.textContent = 'Mit der Maus über ein Bild fahren zoomt den Ausschnitt, Klick öffnet es groß.';
  editLink.href = 'editor.html#edit=' + encodeURIComponent(id);
  renderDetail();
  setHash(encodeURIComponent(l.map) + '/' + encodeURIComponent(id));
  window.scrollTo(0, 0);
  // Vom Radar aus einen bestimmten Wurf angeklickt → direkt dorthin
  const el = step >= 0 && detail.querySelector(`.step[data-step="${step}"]`);
  if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 90);
}

mapsEl.addEventListener('click', e => {
  const card = e.target.closest('.map-card'); if (!card) return;
  showList(card.dataset.map);
});
luList.addEventListener('click', e => {
  const item = e.target.closest('.lu-item'); if (!item) return;
  showDetail(item.dataset.id);
});
document.getElementById('backToMaps').addEventListener('click', showMaps);
document.getElementById('backToList').addEventListener('click', () => showList(activeMap));
q.addEventListener('input', () => { openCluster = -1; renderView(); });

modeSeg.addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b) return;
  showList(activeMap, b.dataset.mode);
});
filtersEl.addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  if (b.dataset.f === 'side') sideFilter = b.dataset.v; else typeFilter = b.dataset.v;
  openCluster = -1;
  renderFilters(); renderView();
});

// Radar: Hover zeigt Wurflinien, Klick öffnet das Lineup bzw. die Auswahl bei mehreren
radarEl.addEventListener('mouseover', e => { const p = e.target.closest('.pin'); if (p) showLines(+p.dataset.c); });
radarEl.addEventListener('mouseout', e => { if (e.target.closest('.pin')) showLines(openCluster); });
radarEl.addEventListener('click', e => {
  const item = e.target.closest('.pop-item');
  if (item) { showDetail(item.dataset.id, +item.dataset.step); return; }
  const p = e.target.closest('.pin');
  if (p) {
    const c = radarClusters[+p.dataset.c];
    if (c.items.length === 1) { showDetail(c.items[0].l.id, c.items[0].step); return; }
    openCluster = openCluster === +p.dataset.c ? -1 : +p.dataset.c;
  } else if (!e.target.closest('.pop')) openCluster = -1;
  renderView();
  const first = radarEl.querySelector('.pop-item');
  if (first && p) first.focus({ preventScroll: true });
});

// Lupe (nur Detailansicht)
attachLens(detail);

// Lightbox (nur Detailansicht)
detail.addEventListener('click', e => {
  const el = e.target.closest('.shot'); if (!el || el.classList.contains('missing')) return;
  lbImg.src = el.dataset.src; lb.classList.add('open');
});
lb.addEventListener('click', () => lb.classList.remove('open'));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  lb.classList.remove('open');
  if (openCluster >= 0) { openCluster = -1; renderView(); }
});

// Start: Daten aller Maps laden, dann rendern + routen.
function boot() {
  renderMaps();
  const raw = location.hash.slice(1);
  if (!raw) { showMaps(); return; }
  const parts = raw.split('/').map(decodeURIComponent);
  const id = parts[1];
  if (id && LINEUPS.some(l => l.id === id)) showDetail(id);
  else if (LINEUPS.some(l => l.map === parts[0])) showList(parts[0], id === 'list' ? 'list' : 'radar');   // alte #…/radar-Links funktionieren weiter
  else showMaps();
}

loadLineups(boot);
</script>
</body>
</html>
